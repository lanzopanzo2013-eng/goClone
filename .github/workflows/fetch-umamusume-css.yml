name: fetch-umamusume-css
on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths: [".github/scripts/fetch_umamusume_css.py", ".github/workflows/fetch-umamusume-css.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch missing stylesheet chunks
        run: python3 -u .github/scripts/fetch_umamusume_css.py
      - name: Commit fetched CSS and provenance
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clones/umamusume.com/_raw/css clones/umamusume.com/_raw/external/parts.umamusume.com/assets/css clones/umamusume.com/_raw/additional-css-fetch.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(clone): archive additional CSS chunks [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
