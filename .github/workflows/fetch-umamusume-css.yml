name: fetch-umamusume-css

# One-shot archival job: pulls the official umamusume.com stylesheets (byte-exact),
# the assets those stylesheets reference, the rendered pages, and a provenance
# manifest (sha256 per file). Runs on a GitHub runner because it has open
# internet access, then commits the result back to the branch that triggered it.

on:
  push:
    branches:
      - "arena/**"
      - "main"
    paths:
      - ".github/workflows/fetch-umamusume-css.yml"
      - ".github/scripts/fetch_umamusume_css.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check connectivity
        run: |
          curl -sS -o /dev/null -w "live   umamusume.com -> %{http_code}\n" --max-time 30 https://umamusume.com/ || true
          curl -sS -o /dev/null -w "wayback web.archive.org -> %{http_code}\n" --max-time 30 https://web.archive.org/ || true

      - name: Fetch stylesheets + assets
        run: python3 .github/scripts/fetch_umamusume_css.py

      - name: Report
        run: |
          du -sh clones/umamusume.com/_raw || true
          head -c 400 clones/umamusume.com/_raw/FETCH_MANIFEST.json || true

      - name: Commit back to the triggering branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A clones/umamusume.com/_raw
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore(clone): archive official umamusume.com stylesheets [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
